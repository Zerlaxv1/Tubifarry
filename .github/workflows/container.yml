name: container

on:
  push:
    branches: [master, song-mode]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lidarr-songmode

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The Lidarr fork is a submodule and the image is built from both.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      # A pull request only has to prove the image still builds, so it is not pushed and
      # needs no registry credentials.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The .NET and yarn caches dominate the build; without this every run pays for
          # restoring both from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green build proves nothing about the plugin: it is staged, not installed, and it only
      # loads if its assembly version matches the host's. Both are invisible until Lidarr runs,
      # so start the image and ask the API whether a Tubifarry indexer showed up.
      - name: Smoke-test the image
        if: github.event_name != 'pull_request'
        env:
          # From the metadata action rather than assembled here: the owner is Zerlaxv1 but a
          # docker reference has to be lowercase, and that step already did the lowercasing.
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run -d --name smoke -p 8686:8686 "$IMAGE"

          for _ in $(seq 30); do
            curl -fsS http://localhost:8686/ping >/dev/null && break
            sleep 5
          done
          curl -fsS http://localhost:8686/ping

          key=$(docker exec smoke sed -n 's|.*<ApiKey>\(.*\)</ApiKey>.*|\1|p' /config/config.xml)
          curl -fsS -H "X-Api-Key: $key" http://localhost:8686/api/v1/indexer/schema | grep -q Lucida

      - name: Lidarr log from the failed smoke test
        if: failure()
        run: docker logs smoke || true
